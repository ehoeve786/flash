name: android

on:
  push:
    paths: ["android/**", "src/QDL/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # Same signing key every build so new APKs install over old ones:
      # SIGNING_KEY secret (base64 .jks) if set, else a debug key kept in the Actions cache.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore
      - name: Signing key from secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk comma-flash.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest comma-flash.apk --prerelease --target "$GITHUB_SHA" \
            --title "comma flash (Android) v0.1.${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME}@${GITHUB_SHA::7})" --notes "Debug build of android/ from ${GITHUB_SHA}"
