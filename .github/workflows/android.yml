name: android

on:
  push:
    paths: ["android/**", "src/QDL/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk comma-flash.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest comma-flash.apk --prerelease --target "$GITHUB_SHA" \
            --title "comma flash (Android) ${GITHUB_REF_NAME}@${GITHUB_SHA::7}" --notes "Debug build of android/ from ${GITHUB_SHA}"
